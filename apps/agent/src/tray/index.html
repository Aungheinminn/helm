<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Helm</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        background: #1a1a1c;
        color: #f2f2f2;
        user-select: none;
      }
      .layout { display: flex; height: 100vh; }

      aside {
        width: 200px;
        background: #141416;
        border-right: 1px solid #2a2a2e;
        display: flex;
        flex-direction: column;
        padding-top: env(titlebar-area-height, 40px);
      }
      aside .brand {
        padding: 8px 16px 16px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
        -webkit-app-region: drag;
      }
      aside nav { flex: 1; padding: 8px; }
      aside nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: #bbb;
        border: 0;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 2px;
      }
      aside nav button:hover { background: #22222a; color: #fff; }
      aside nav button.active { background: #2f2f3a; color: #fff; }
      aside .foot { padding: 12px; border-top: 1px solid #2a2a2e; }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 32px 40px;
      }
      main h2 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
      }
      main p.muted { color: #888; font-size: 13px; margin: 0 0 20px; }

      #qr { background: white; padding: 10px; border-radius: 8px; display: inline-block; }
      #qr svg { display: block; }

      .pair-fields {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 80px 1fr;
        row-gap: 8px;
        column-gap: 16px;
        max-width: 360px;
        align-items: center;
      }
      .pair-fields .label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .pair-fields .value {
        font-family: "SF Mono", Menlo, monospace;
        font-size: 13px;
        color: #e8e8e8;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
        word-break: break-all;
      }

      button.primary, button.danger, button.plain {
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
        color: #fff;
      }
      button.primary { background: #2f6fd6; }
      button.primary:hover { background: #3f7fe6; }
      button.plain { background: #2f2f36; }
      button.plain:hover { background: #3a3a44; }
      button.danger { background: #6a2828; }
      button.danger:hover { background: #8a2f2f; }

      .actions { display: flex; gap: 8px; margin-top: 20px; }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid #2a2a2e;
      }
      .row:last-child { border-bottom: 0; }
      .row .name { font-size: 14px; }
      .row .seen { font-size: 11px; color: #888; margin-top: 2px; }
      .empty { color: #666; font-size: 13px; padding: 20px 0; }

      .setting { margin-bottom: 20px; }
      .setting .label { font-size: 13px; color: #bbb; margin-bottom: 4px; }
      .setting .value { font-family: "SF Mono", Menlo, monospace; font-size: 13px; color: #ddd; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div class="brand">Helm</div>
        <nav>
          <button data-section="pairing" class="active">Pairing</button>
          <button data-section="devices">Devices</button>
          <button data-section="settings">Settings</button>
        </nav>
        <div class="foot">
          <button id="quit" class="danger" style="width: 100%">Quit Helm</button>
        </div>
      </aside>
      <main>
        <section id="section-pairing">
          <h2>Pair a phone</h2>
          <p class="muted">Open the Helm PWA on your phone and scan this code.</p>
          <div id="qr"></div>
          <div class="pair-fields">
            <div class="label">Endpoint</div>
            <div class="value" id="pairEndpoint"></div>
            <div class="label">Code</div>
            <div class="value" id="pairCode"></div>
          </div>
          <div class="actions">
            <button id="rotate" class="plain">Rotate code</button>
            <button id="copy" class="plain">Copy code</button>
          </div>
        </section>

        <section id="section-devices" hidden>
          <h2>Paired devices</h2>
          <p class="muted">Revoke access for any lost or unused phone.</p>
          <div id="devices"></div>
        </section>

        <section id="section-settings" hidden>
          <h2>Settings</h2>
          <p class="muted">Read-only for now.</p>
          <div class="setting">
            <div class="label">Endpoint</div>
            <div class="value" id="endpoint"></div>
          </div>
          <div class="setting">
            <div class="label">Hostname</div>
            <div class="value" id="hostname"></div>
          </div>
          <div class="setting">
            <div class="label">Data directory</div>
            <div class="value">~/.helm</div>
          </div>
        </section>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
